name: Build PKHeX Plugin Pile

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show repository files
        shell: pwsh
        run: Get-ChildItem -Force -Recurse | Select-Object FullName

      - name: Run project build script
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          ./build.ps1

      - name: Show build output
        if: always()
        shell: pwsh
        run: |
          Write-Host "Searching for build outputs..."
          Get-ChildItem -Force -Recurse -Include *.dll,*.zip |
            Select-Object FullName, Length

      - name: Upload all likely build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-outputs
          path: |
            **/bin/**/*.dll
            **/bin/**/*.zip
            **/*.zip
          if-no-files-found: error
